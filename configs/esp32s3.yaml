data_path: data/uwb_demo_input.mat
output_dir: results/esp32s3
case: 1
seed: 11
input_length: 176
augmentation_probability: 0.30
validation_fraction: 0.15

# Optional rich offline teacher. The bundled quick teacher is only for the
# synthetic smoke/demo path. Train a converged teacher for final experiments.
teacher_checkpoint_dir: results/quick/checkpoints/case1_seed11
use_teacher_distillation: true

# Wider discovery network. Hidden width is also prunable by the structured LTH search.
supernet:
  channels: [12, 18, 24]
  hidden: 24

# Progressive physically-dense Lottery Ticket candidates. They are tried from
# smallest parameter count upward and training stops at the first candidate
# that satisfies the MAE guard. The exporter NEVER substitutes the random control.
ticket_candidates:
  - channels: [6, 8, 8]
    hidden: 10
  - channels: [8, 10, 10]
    hidden: 12
  - channels: [8, 12, 12]
    hidden: 16
  - channels: [10, 16, 20]
    hidden: 18
  - channels: [12, 18, 24]
    hidden: 20

lth_search:
  max_relative_mae_loss: 0.08
  max_absolute_mae_loss_ns: 0.03
  max_nll_increase: 0.25
  max_outlier_bce_increase: 0.10
  require_accuracy_guard: true

training:
  epochs_supernet: 30
  epochs_ticket: 40
  epochs_control: 40
  batch_size: 64
  learning_rate: 0.002
  weight_decay: 0.0001
  patience: 10
  student_nu: 4.0
  min_scale_fraction: 0.004
  distill_mean_weight: 1.0
  distill_scale_weight: 0.25
  corruption_weight: 0.15
  device: cpu

export:
  target: esp32s3
  calibration_samples: 256
  onnx: false
  espdl: false
