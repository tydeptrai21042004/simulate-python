[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwb-passive-tracking"
version = "1.0.0"
description = "Paper-faithful PyTorch reproduction and uncertainty-aware UWB passive human tracking research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "torch>=2.1",
  "gdown>=5.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uwb-track = "uwb_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
