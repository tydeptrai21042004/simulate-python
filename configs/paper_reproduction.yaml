# Architecture/protocol smoke reproduction on the bundled synthetic dataset.
# Do not compare these numbers with the paper's experimental results.
data_path: data/uwb_demo_input.mat
output_dir: results/paper_reproduction_synthetic
cases: [1, 2, 3]
seeds: [2022]
scenarios: [los]
device: auto
model:
  input_length: 500
  epochs: 50
  batch_size: 64
  paper_batch_fraction: 0.10
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: adam
  early_stopping: false
  restore_best: false
  paper_indexing_mode: repository
  paper_validation_mode: sample
  paper_validation_fraction: 0.15
  augmentation_probability: 0.0
particle_filter:
  num_particles: 200
